name: CI (offline only)

# Offline verification only. This workflow NEVER creates a Colab GPU, NEVER
# touches Google Drive, NEVER uses any credential, and NEVER runs a live
# video inference. Real GPU acceptance is a separate, explicitly authorised
# manual task (see docs/runbooks/).
#
# Jobs are independent: no job `needs` another, so a failure in unit-tests
# can never silently skip the security checks. The run is green only when
# every required job is green.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        # Pins from requirements.lock (verified source venv); see
        # requirements-ci.txt. setup-python ships no requests/PyYAML.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Python syntax and import check
        run: python -m py_compile *.py jobs/minimax_h3_ab/video_contract.py tests/*.py scripts/*.py
      - name: Unit + mock integration tests (CI entry point)
        # tests/run_ci_tests.py runs unittest discover, skipping only the two
        # asset-gated poster tests (poster binary excluded from the repo).
        # Tests that need a real patched CLI / Drive / GPU live in
        # live-preflight form only; clean-checkout tests use fixtures/mocks.
        run: python tests/run_ci_tests.py

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflow JSON schema check
        run: python scripts/check_workflow_schema.py

  patch-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI patch verification (offline)
        run: python scripts/verify_patch.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks must scan every commit, not just HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gitleaks 8.27.2 (pinned release, SHA-256 verified)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz
          echo "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Gitleaks scan (worktree + full git history, values redacted)
        run: |
          /tmp/gitleaks dir . --redact -f json -r /tmp/gitleaks-worktree.json
          /tmp/gitleaks git . --redact -f json -r /tmp/gitleaks-history.json
      - name: Secret scan (pattern scan, file:line only — values never printed)
        # scripts/secret_scan.py also enforces the no-credential-filenames
        # rule. Its only exemption is the delimited redaction-regex table
        # in reference_v2/colab_manager.py (the scrubber itself).
        run: python scripts/secret_scan.py

  docs-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs index + manifest consistency
        run: python scripts/check_docs_index.py
